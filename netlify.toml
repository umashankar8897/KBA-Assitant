# Netlify configuration.
#
# There is no build step: the app is plain HTML, CSS and JavaScript, served as
# it sits in the repository.

[build]
  publish = "."

# Netlify already falls back to 404.html for a path that matches no file. This
# says so explicitly, so the behaviour survives someone changing the settings in
# the dashboard. Static files are matched first, so this only catches what is
# genuinely missing.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
